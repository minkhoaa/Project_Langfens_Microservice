name: langfens-benchmark-m3

services:
  exam-database:
    image: postgres:16-alpine
    container_name: benchmark-m3-db
    environment:
      POSTGRES_DB: exam-db
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    networks:
      - benchmark-net
    volumes:
      - bench_m3_pgdata:/var/lib/postgresql/exam-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam-db -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "5448:5432"

  generation-service:
    image: langfens-generation:benchmark
    container_name: benchmark-m3-gen
    ports:
      - "8086:8080"
    volumes:
      - ../services/generation-service/app:/app/app
    env_file:
      - path: ./envs/ai.env
        required: false
      - path: ./envs/loop-caps.env
        required: false
    environment:
      - MINIMAX_MODEL=MiniMax-M3
      - LLM_PROVIDER_ORDER=minimax
      - EXAM_SERVICE_URL=http://exam-service:8080
      - EXAMSERVICE__EXAM__ADDRESS=http://exam-service:8080
      - EXAMSERVICE__INTERNAL__API__KEY=dev-internal-key-not-for-prod
      - INTERNAL_API_KEY=dev-internal-key-not-for-prod
      - LOOP_OPERATION_WALL_RESERVATION_SECONDS=180
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    networks:
      - benchmark-net

  exam-service:
    image: langfens-exam:benchmark
    container_name: benchmark-m3-exam
    ports:
      - "8087:8080"
    environment:
      - ConnectionStrings__exam-db=Host=exam-database;Port=5432;Database=exam-db;Username=exam;Password=exam
      - GENERATION_SERVICE_URL=http://generation-service:8080
      - EXAMSERVICE__INTERNAL__API__KEY=dev-internal-key-not-for-prod
      - INTERNAL_API_KEY=dev-internal-key-not-for-prod
      - JwtSettings__SignKey=bTNGPmniBGyINHPdsmONct16TIqqb1bZ
      - JwtSettings__Issuer=IssuerName
      - JwtSettings__Audience=AudienceName
      - READING_PAPER_WORKER_ENABLED=true
      - READING_PAPER_LLM_PROVIDER=minimax
      - CANARY_PERCENTAGE=100
      - READING_PAPER_ENGINE=v2
      - LOOP_CAPS_PROFILE_SOURCE=deploy/envs/loop-caps.env
      - LOOP_CAPS_PROFILE_VERSION=phase13-production-v1
    env_file:
      - path: ./envs/loop-caps.env
        required: false
    depends_on:
      exam-database:
        condition: service_healthy
      generation-service:
        condition: service_started
    networks:
      - benchmark-net

networks:
  benchmark-net:
    driver: bridge

volumes:
  bench_m3_pgdata:
